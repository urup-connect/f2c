# Promote a release from QA to UAT, and from UAT to production.
#
# **Nothing is rebuilt here. All three artefacts are promoted by digest.** Each
# of `f2c/api`, `f2c/club` and `f2c/market` reads every environment-specific
# value from the container app at runtime -- design/deploy.md section 3 -- so a
# promotion moves the image the target environment will run: the revision is
# pinned to the digest and `az acr import` retags it server-side, no pull, no
# push, no rebuild. What ran in QA is bit-for-bit what runs in production.
#
# **This used to be true of the API alone.** The frontends baked `SITE_URL`,
# `APP_ENV`, `CDN_BASE_URL` and `SUPPORT_EMAIL`, because `lib/site.ts` read them
# when the module was first loaded and `next build` loads every module. A QA
# frontend image therefore could not be promoted -- risk R-D4 -- and this job
# rebuilt the commit with the target environment's build arguments instead. That
# is closed: `lib/site.ts` reads them during render, and the container app
# supplies them.
#
# **The input is still a commit SHA, but it is now a choice rather than a
# constraint.** An image tag would do -- there is one image per artefact per
# commit and no environment prefix left to get wrong. A SHA is kept because it
# names all three artefacts at once and reads the same in the run log as it does
# in `git log`.
#
# **What stands in for re-running the tests.** `ci.yml` is not called from here,
# and deliberately: a called workflow runs at the *caller's* ref, so it would
# test trunk rather than the commit being promoted, and report green for the
# wrong code. The gate is the registry instead. `f2c/api:<sha>` exists only
# because `release.yml` built it, and that job has `needs: test` -- so an image
# in the registry is a commit that passed on MySQL 8.4. A SHA with no image is
# refused below rather than built here.
#
# **The ladder is enforced, not assumed.** Promoting to production checks that
# the digest is the one UAT is currently running. Deploying to production
# something that was never in UAT is possible -- `skip_ladder_check` -- but it
# takes a deliberate tick and it is recorded in the run.

name: Promote

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full commit SHA to promote. Must already have images in the registry'
        type: string
        required: true
      to_env:
        description: 'Target environment'
        type: choice
        required: true
        # **`prod`, not `production`, and the name is load-bearing three times
        # over.** `environment: ${{ inputs.to_env }}` below resolves this value
        # against the repository's GitHub environments, the federated credential
        # subject `azure-oidc-setup` writes ends `:environment:<name>`, and the
        # moving registry tag this workflow's last step pushes is named from it.
        # Those three have to agree, and `prod` is what the environment is
        # called -- matching `rg-f2c-prod-weu`.
        #
        # It used to read `production`, which failed *open* rather than closed:
        # GitHub creates an environment named by a workflow that does not exist
        # rather than refusing, so the run got an empty `production` environment
        # carrying no variables and -- the part that mattered -- no required
        # reviewers. The approval gate on production silently did not apply, and
        # the run then died further on at `require_vars.py`.
        options: [uat, prod]
      api:
        description: 'Promote the API (api, worker, mail-worker, beat)'
        type: boolean
        default: true
      club:
        description: 'Promote and deploy the club frontend'
        type: boolean
        default: true
      market:
        description: 'Promote and deploy the market frontend'
        type: boolean
        default: false
      skip_ladder_check:
        description: 'Promote to production something UAT is not running. Recorded in the run'
        type: boolean
        default: false

# A literal prefix rather than `${{ github.workflow }}` -- see the note in
# `ci.yml`. One promotion per environment at a time, and never cancelled
# halfway: a cancelled promotion can leave the API rolled forward and a frontend
# on the previous release.
concurrency:
  group: promote-${{ inputs.to_env }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
  API_REPOSITORY: f2c/api

jobs:
  # ------------------------------------------------------------------ the checks
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    # The environment gate applies here, before anything is resolved, so an
    # unapproved promotion never reads the target's configuration at all.
    environment: ${{ inputs.to_env }}
    permissions:
      contents: read
      id-token: write
    outputs:
      api_digest: ${{ steps.resolve.outputs.api_digest }}
      frontends: ${{ steps.resolve.outputs.frontends }}
    steps:
      - name: Confirm the commit exists
        uses: actions/checkout@v4
        with:
          # A bad SHA fails here, with "couldn't find remote ref", before any
          # Azure call has been made.
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - name: Fetch the deployment scripts from trunk
        # Trunk, not `inputs.sha`, and only `.github/scripts`. `promote-api`
        # takes the same line on `deploy-api.sh`: deployment tooling comes from
        # trunk so that a fix to it reaches the promotion of an older commit.
        # Beside the workspace rather than into it -- the checkout above cleans
        # what it lands in.
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 1
          path: trunk

      - name: Check the deployment variables
        # Before `azure/login`, which reports three unset variables as a fault
        # in its own `auth-type`. A promotion is the first time this
        # environment's variables are read at all, so this is where a `uat` or
        # `prod` environment nobody finished setting up shows up.
        env:
          VARS: ${{ toJSON(vars) }}
          ENVIRONMENT: ${{ inputs.to_env }}
        run: >-
          python3 trunk/.github/scripts/require_vars.py
          AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID
          ACR_NAME

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the API digest and check the ladder
        id: resolve
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          API_REPOSITORY: ${{ env.API_REPOSITORY }}
          SHA: ${{ inputs.sha }}
          TO_ENV: ${{ inputs.to_env }}
          WANT_API: ${{ inputs.api }}
          WANT_CLUB: ${{ inputs.club }}
          WANT_MARKET: ${{ inputs.market }}
          SKIP_LADDER: ${{ inputs.skip_ladder_check }}
          DEPLOY_MARKET: ${{ vars.DEPLOY_MARKET }}
        run: |
          set -euo pipefail

          digest=''
          if [ "$WANT_API" = 'true' ]; then
            # The registry is the gate. No image means no `release.yml` run, and
            # no `release.yml` run means the commit was never proved against
            # MySQL 8.4 -- see the header.
            if ! digest=$(bash .github/scripts/acr-digest.sh \
                            "$ACR_NAME" "${API_REPOSITORY}:${SHA}"); then
              echo "::error::No ${API_REPOSITORY}:${SHA} in the registry." \
                   "Only a commit that has been through release.yml -- and therefore" \
                   "through the tests -- can be promoted. Run release.yml first."
              exit 1
            fi
            echo "API digest: $digest"

            # **Production takes what UAT is running, and nothing else.** The
            # `:uat` tag is moved by this workflow as the last step of a UAT
            # promotion, so it is a faithful record of what was signed off.
            if [ "$TO_ENV" = 'prod' ] && [ "$SKIP_LADDER" != 'true' ]; then
              uat_digest=$(bash .github/scripts/acr-digest.sh \
                             "$ACR_NAME" "${API_REPOSITORY}:uat" || echo '')

              if [ -z "$uat_digest" ]; then
                echo "::error::${API_REPOSITORY}:uat does not exist, so there is" \
                     "nothing signed off to promote. Promote to UAT first, or tick" \
                     "skip_ladder_check and say why in the run."
                exit 1
              fi

              if [ "$uat_digest" != "$digest" ]; then
                echo "::error::UAT is running $uat_digest and this promotion carries" \
                     "$digest. Production would receive a release UAT never saw." \
                     "Promote this commit to UAT first, or tick skip_ladder_check."
                exit 1
              fi
              echo "Ladder check passed: this is the digest UAT is running."
            elif [ "$SKIP_LADDER" = 'true' ]; then
              echo "::warning::skip_ladder_check is set. $TO_ENV is receiving a" \
                   "release that was not verified in the environment below it."
            fi
          fi

          club="$WANT_CLUB"
          market="$WANT_MARKET"
          if [ "$DEPLOY_MARKET" != 'true' ] && [ "$market" = 'true' ]; then
            echo "vars.DEPLOY_MARKET is not 'true' for $TO_ENV: skipping the market."
            market=false
          fi

          frontends='[]'
          if [ "$club" = 'true' ] && [ "$market" = 'true' ]; then
            frontends='["club","market"]'
          elif [ "$club" = 'true' ]; then
            frontends='["club"]'
          elif [ "$market" = 'true' ]; then
            frontends='["market"]'
          fi

          {
            echo "api_digest=$digest"
            echo "frontends=$frontends"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Promoting to ${TO_ENV}"
            echo ''
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${SHA}\` |"
            echo "| API | ${digest:-not promoted} |"
            echo "| Frontends promoted | ${frontends} |"
            echo "| Ladder check skipped | ${SKIP_LADDER} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------- the API, by digest
  promote-api:
    name: Promote the API to ${{ inputs.to_env }}
    needs: verify
    if: inputs.api && needs.verify.outputs.api_digest != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.to_env }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Trunk, not the promoted SHA. What is wanted here is the *current*
          # deployment script, not the one that shipped with the release -- a
          # fix to the roll-out order should apply to a promotion of an older
          # commit too.
          fetch-depth: 1

      - name: Check the deployment variables
        # Checked out from trunk above, so this reads the current list rather
        # than the one that shipped with the commit being promoted.
        env:
          VARS: ${{ toJSON(vars) }}
          ENVIRONMENT: ${{ inputs.to_env }}
        run: >-
          python3 .github/scripts/require_vars.py
          AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID
          ACR_NAME AZURE_RESOURCE_GROUP
          CONTAINERAPP_API CONTAINERAPP_WORKER CONTAINERAPP_MAIL_WORKER
          CONTAINERAPP_BEAT

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.API_REPOSITORY }}@${{ needs.verify.outputs.api_digest }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_API: ${{ vars.CONTAINERAPP_API }}
          APP_WORKER: ${{ vars.CONTAINERAPP_WORKER }}
          APP_MAIL_WORKER: ${{ vars.CONTAINERAPP_MAIL_WORKER }}
          APP_BEAT: ${{ vars.CONTAINERAPP_BEAT }}
        run: bash .github/scripts/deploy-api.sh

      - name: Move the environment tag
        # Last, and only on success. This tag is what the next promotion's
        # ladder check reads, so it must mean "this is running here" rather than
        # "somebody tried to put this here".
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          SOURCE: ${{ env.REGISTRY }}/${{ env.API_REPOSITORY }}@${{ needs.verify.outputs.api_digest }}
          TARGET: ${{ env.API_REPOSITORY }}:${{ inputs.to_env }}
        run: |
          az acr import --name "$ACR_NAME" \
            --source "$SOURCE" --image "$TARGET" --force

  # --------------------------------------------- the frontends, by digest
  promote-frontend:
    name: Promote the ${{ matrix.app }} frontend to ${{ inputs.to_env }}
    needs: verify
    if: needs.verify.outputs.frontends != '[]'
    runs-on: ubuntu-latest
    environment: ${{ inputs.to_env }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.verify.outputs.frontends) }}
    steps:
      - name: Fetch the deployment scripts from trunk
        # Trunk, not `inputs.sha`, and only `.github/scripts`. `promote-api`
        # takes the same line on `deploy-api.sh`: deployment tooling comes from
        # trunk so that a fix to it reaches the promotion of an older commit.
        #
        # **The promoted commit is no longer checked out at all.** It used to be
        # -- this job rebuilt the image from source, which was the whole reason
        # the input is a SHA. With R-D4 closed there is nothing here to build,
        # and the SHA is a registry lookup key.
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 1

      - name: Check the deployment variables
        # The container app name and the registry. `APP_ENV`, `CLUB_SITE_URL`,
        # `CLUB_CDN_BASE_URL`, `CLUB_SUPPORT_EMAIL` and `MARKET_SITE_URL` were
        # checked here while they were build arguments. They are container app
        # settings now, set on the app itself rather than passed through a
        # workflow run -- see design/deploy-quickstart.md tables D and E -- and
        # `frontend/deploy/entrypoint.sh` refuses to start a container that is
        # missing one.
        env:
          VARS: ${{ toJSON(vars) }}
          ENVIRONMENT: ${{ inputs.to_env }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          case "$APP" in
            club)   per_app='CONTAINERAPP_CLUB' ;;
            market) per_app='CONTAINERAPP_MARKET' ;;
            *)      echo "Unknown application: $APP" >&2; exit 1 ;;
          esac
          # shellcheck disable=SC2086
          python3 .github/scripts/require_vars.py \
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            ACR_NAME AZURE_RESOURCE_GROUP $per_app

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the digest and check the ladder
        id: resolve
        # The same two gates `verify` applies to the API, applied per frontend.
        # Both are newly possible: while a frontend image was specific to one
        # environment there was no single digest to follow up the ladder, so
        # production could receive a storefront no one had seen in UAT and
        # nothing would say so.
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          APP: ${{ matrix.app }}
          SHA: ${{ inputs.sha }}
          TO_ENV: ${{ inputs.to_env }}
          SKIP_LADDER: ${{ inputs.skip_ladder_check }}
        run: |
          set -euo pipefail

          # The registry is the gate: no image means no `release.yml` run, and
          # no `release.yml` run means the commit was never proved by the tests.
          if ! digest=$(bash .github/scripts/acr-digest.sh \
                          "$ACR_NAME" "f2c/${APP}:${SHA}"); then
            echo "::error::No f2c/${APP}:${SHA} in the registry. Only a commit" \
                 "that has been through release.yml -- and therefore through the" \
                 "tests -- can be promoted. Run release.yml first."
            exit 1
          fi
          echo "$APP digest: $digest"

          # Production takes what UAT is running. The `:uat` tag is moved by
          # this job as its last step, so it records what was signed off.
          if [ "$TO_ENV" = 'prod' ] && [ "$SKIP_LADDER" != 'true' ]; then
            uat_digest=$(bash .github/scripts/acr-digest.sh \
                           "$ACR_NAME" "f2c/${APP}:uat" || echo '')

            if [ -z "$uat_digest" ]; then
              echo "::error::f2c/${APP}:uat does not exist, so there is nothing" \
                   "signed off to promote. Promote to UAT first, or tick" \
                   "skip_ladder_check and say why in the run."
              exit 1
            fi

            if [ "$uat_digest" != "$digest" ]; then
              echo "::error::UAT is running $uat_digest for $APP and this" \
                   "promotion carries $digest. Production would receive a" \
                   "storefront UAT never saw. Promote this commit to UAT first," \
                   "or tick skip_ladder_check."
              exit 1
            fi
            echo "Ladder check passed for $APP: this is the digest UAT is running."
          elif [ "$SKIP_LADDER" = 'true' ]; then
            echo "::warning::skip_ladder_check is set. $TO_ENV is receiving a" \
                 "$APP image that was not verified in the environment below it."
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          REGISTRY: ${{ env.REGISTRY }}
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_CLUB: ${{ vars.CONTAINERAPP_CLUB }}
          APP_MARKET: ${{ vars.CONTAINERAPP_MARKET }}
        run: |
          set -euo pipefail

          case "$APP" in
            club)   container_app="$APP_CLUB" ;;
            market) container_app="$APP_MARKET" ;;
            *)      echo "Unknown application: $APP" >&2; exit 1 ;;
          esac

          az containerapp update \
            --name "$container_app" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${REGISTRY}/f2c/${APP}@${DIGEST}" \
            --output none

          echo "$container_app is on f2c/${APP}@${DIGEST}"

      - name: Move the environment tag
        # Last, and only on success -- `promote-api`'s rule, for its reason:
        # this tag is what the next promotion's ladder check reads, so it must
        # mean "this is running here" rather than "somebody tried to put this
        # here".
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          TO_ENV: ${{ inputs.to_env }}
        run: |
          az acr import --name "$ACR_NAME" \
            --source "${REGISTRY}/f2c/${APP}@${DIGEST}" \
            --image "f2c/${APP}:${TO_ENV}" --force
